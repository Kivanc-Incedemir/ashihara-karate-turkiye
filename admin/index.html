<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>İçerik Yönetimi · Ashihara Karate Türkiye</title>
    <style>
      /* Decap CMS has no built-in "stats" section, so this links out to the
         Cloudflare Web Analytics dashboard instead (aggregate pageview/visit
         counts only — Cloudflare Web Analytics never tracks individuals). */
      #stats-link {
        position: fixed;
        top: 12px;
        right: 16px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #1a1a1a;
        color: #fff;
        font: 600 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-decoration: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      }
      #stats-link:hover {
        background: #333;
      }
    </style>
  </head>
  <body>
    <a
      id="stats-link"
      href="https://dash.cloudflare.com/?to=/b608ddaa93d9790707db391210641a6a/web-analytics"
      target="_blank"
      rel="noopener"
    >📊 Ziyaret İstatistikleri</a>
    <script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
    <script>
      // Live preview: renders "Site Metinleri" and "Galeri Fotoğrafları" entries
      // using the real site's colors/fonts, so non-technical editors see roughly
      // how their change will look instead of a flat list of text boxes.
      CMS.registerPreviewStyle(
        "@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');" +
          ":root{--sumi:#12100E;--ink:#1B1714;--panel:#1F1A16;--bone:#F4EFE6;--bone-dim:#C9C1B3;--stone:#8A827A;--red:#D11A2A;--brass:#C9A24B;--line:rgba(244,239,230,.12);--ff-display:'Oswald','Arial Narrow',sans-serif;--ff-body:'Inter',system-ui,sans-serif;}" +
          "body{background:var(--sumi);color:var(--bone);font-family:var(--ff-body);margin:0;padding:24px;}" +
          ".stp-head{font-family:var(--ff-display);text-transform:uppercase;letter-spacing:.08em;color:var(--brass);font-size:.8rem;margin-bottom:18px;}" +
          ".stp-row{border-bottom:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:140px 1fr 1fr;gap:16px;align-items:start;}" +
          ".stp-row.stp-link{grid-template-columns:140px 1fr;}" +
          ".stp-key{font-family:var(--ff-display);font-size:.65rem;letter-spacing:.04em;color:var(--stone);text-transform:uppercase;word-break:break-all;}" +
          ".stp-tr,.stp-en,.stp-html{font-size:.95rem;line-height:1.5;}" +
          ".stp-en{color:var(--bone-dim);}" +
          ".stp-html code{background:var(--panel);color:var(--brass);padding:2px 6px;border-radius:4px;font-family:monospace;}" +
          ".stp-note{grid-column:1/-1;font-size:.8rem;}" +
          ".stp-ok{color:#7FBF7F;}" +
          ".stp-warn{color:var(--red);font-weight:600;}" +
          ".stp-whatsapp-btn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#0b1b12;font-weight:600;padding:10px 16px;border-radius:999px;text-decoration:none;width:fit-content;margin-bottom:8px;}" +
          ".gp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}" +
          ".gp-card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}" +
          ".gp-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}" +
          ".gp-badge{display:inline-block;margin:10px 12px 0;font-family:var(--ff-display);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass);padding:2px 8px;border-radius:999px;}" +
          ".gp-tr{padding:8px 12px 2px;font-size:.9rem;}" +
          ".gp-en{padding:0 12px 12px;font-size:.8rem;color:var(--bone-dim);}",
        { raw: true }
      );

      var CATEGORY_LABELS = { training: "Antrenman", grading: "Kuşak Sınavı", event: "Etkinlik" };

      var SiteTextPreview = createClass({
        render: function () {
          var data = this.props.entry.get("data").toJS();
          var items = data.strings || [];
          return h(
            "div",
            {},
            h("div", { className: "stp-head" }, "Önizleme"),
            items.map(function (item) {
              if (item.key === "whatsapp.href") {
                var valid = /^https:\/\/wa\.me\//.test(item.tr) && /^https:\/\/wa\.me\//.test(item.en);
                return h(
                  "div",
                  { key: item.key, className: "stp-row stp-link" },
                  h("div", { className: "stp-key" }, item.key),
                  h(
                    "a",
                    { className: "stp-whatsapp-btn", href: item.tr, target: "_blank", rel: "noopener" },
                    "💬 WhatsApp ile Yaz"
                  ),
                  h(
                    "div",
                    { className: "stp-note " + (valid ? "stp-ok" : "stp-warn") },
                    valid
                      ? "✓ Bağlantı geçerli görünüyor"
                      : "⚠️ Bu bağlantı https://wa.me/ ile başlamıyor — buton çalışmayabilir"
                  )
                );
              }
              if (item.key === "gal.empty.body") {
                var okTr = /<code>[^<]*<\/code>/.test(item.tr);
                var okEn = /<code>[^<]*<\/code>/.test(item.en);
                return h(
                  "div",
                  { key: item.key, className: "stp-row" },
                  h("div", { className: "stp-key" }, item.key),
                  h("div", { className: "stp-html", dangerouslySetInnerHTML: { __html: item.tr } }),
                  h("div", { className: "stp-html stp-en", dangerouslySetInnerHTML: { __html: item.en } }),
                  h(
                    "div",
                    { className: "stp-note " + (okTr && okEn ? "stp-ok" : "stp-warn") },
                    okTr && okEn
                      ? "✓ Yukarıdaki kutu içindeki vurgu korunmuş"
                      : "⚠️ Yukarıdaki \"photos/\" vurgusu eksik veya bozuk — metin sitede farklı görünebilir"
                  )
                );
              }
              return h(
                "div",
                { key: item.key, className: "stp-row" },
                h("div", { className: "stp-key" }, item.key),
                h("div", { className: "stp-tr" }, item.tr),
                h("div", { className: "stp-en" }, item.en)
              );
            })
          );
        },
      });
      // "site_text" is a *files* collection — Decap keys preview templates by each
      // file's own `name`, not the parent collection's name, so register per file.
      [
        "global",
        "home",
        "about",
        "gallery_page",
        "dojos",
        "world_history",
        "turkey_history",
      ].forEach(function (fileName) {
        CMS.registerPreviewTemplate(fileName, SiteTextPreview);
      });

      var GalleryPreview = createClass({
        render: function () {
          var data = this.props.entry.get("data").toJS();
          var photos = data.photos || [];
          var getAsset = this.props.getAsset;
          return h(
            "div",
            { className: "gp-grid" },
            photos.map(function (p, i) {
              var src = p.file ? getAsset(p.file).toString() : "";
              return h(
                "figure",
                { key: i, className: "gp-card" },
                src ? h("img", { className: "gp-img", src: src }) : null,
                h("span", { className: "gp-badge" }, CATEGORY_LABELS[p.category] || p.category),
                h(
                  "figcaption",
                  {},
                  h("div", { className: "gp-tr" }, p.tr),
                  h("div", { className: "gp-en" }, p.en)
                )
              );
            })
          );
        },
      });
      CMS.registerPreviewTemplate("manifest", GalleryPreview);

      // Guardrails: blocks saving if a value that must keep a specific format
      // (a WhatsApp link, an HTML tag) was broken by an edit. Applies to every
      // "Site Metinleri" file since they all share the same strings/key/tr/en shape.
      function checkStringsForProblems(data) {
        var problems = [];
        (data.strings || []).forEach(function (item) {
          if (item.key === "whatsapp.href") {
            if (!/^https:\/\/wa\.me\//.test(item.tr) || !/^https:\/\/wa\.me\//.test(item.en)) {
              problems.push(
                "WhatsApp bağlantısı (whatsapp.href) \"https://wa.me/\" ile başlamıyor. Bu haliyle kaydedilirse WhatsApp butonu çalışmayabilir."
              );
            }
          }
          if (item.key === "gal.empty.body") {
            var okTr = /<code>[^<]*<\/code>/.test(item.tr);
            var okEn = /<code>[^<]*<\/code>/.test(item.en);
            if (!okTr || !okEn) {
              problems.push(
                "Boş galeri mesajındaki (gal.empty.body) \"photos/\" vurgusu eksik veya bozuk. Metin sitede farklı görünebilir."
              );
            }
          }
        });
        return problems;
      }

      function guardEntry(payload) {
        var data = payload.entry.get("data").toJS();
        var problems = checkStringsForProblems(data);
        if (problems.length) {
          var ok = window.confirm(
            "Dikkat, bu değişiklik bir şeyi bozabilir:\n\n- " +
              problems.join("\n- ") +
              "\n\nYine de kaydetmek istiyor musunuz?"
          );
          if (!ok) {
            throw new Error("Kaydetme, olası bir hata nedeniyle iptal edildi.");
          }
        }
        return payload.entry.get("data");
      }

      CMS.registerEventListener({ name: "preSave", handler: guardEntry });
      CMS.registerEventListener({ name: "prePublish", handler: guardEntry });
    </script>
  </body>
</html>
