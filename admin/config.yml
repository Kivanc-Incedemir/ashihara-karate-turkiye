backend:
  name: github
  repo: Kivanc-Incedemir/ashihara-karate-turkiye
  branch: master
  base_url: "https://ashihara-cms-oauth.kivanc-incedemir.workers.dev"

publish_mode: simple
media_folder: "photos"
public_folder: "photos"

collections:
  - name: "gallery"
    label: "Galeri Fotoğrafları"
    files:
      - name: "manifest"
        label: "Fotoğraf Listesi"
        file: "photos/manifest.json"
        fields:
          - label: "Fotoğraflar"
            name: "photos"
            widget: "list"
            summary: "{{fields.tr}}"
            fields:
              - { label: "Fotoğraf", name: "file", widget: "image" }
              - label: "Kategori"
                name: "category"
                widget: "select"
                default: "training"
                options:
                  - { label: "Antrenman", value: "training" }
                  - { label: "Kuşak Sınavı", value: "grading" }
                  - { label: "Etkinlik", value: "event" }
              - { label: "Başlık (Türkçe)", name: "tr", widget: "string" }
              - { label: "Caption (English)", name: "en", widget: "string" }

  - name: "site_text"
    label: "Site Metinleri"
    files:
      - name: "tr"
        label: "Türkçe Metinler"
        file: "assets/i18n/tr.json"
        fields:
          - label: "Metinler"
            name: "strings"
            widget: "list"
            summary: "{{fields.key}}"
            fields:
              - { label: "Anahtar (dokunmayın)", name: "key", widget: "string" }
              - { label: "Metin", name: "value", widget: "text" }
      - name: "en"
        label: "English Text"
        file: "assets/i18n/en.json"
        fields:
          - label: "Strings"
            name: "strings"
            widget: "list"
            summary: "{{fields.key}}"
            fields:
              - { label: "Key (do not touch)", name: "key", widget: "string" }
              - { label: "Text", name: "value", widget: "text" }
