backend:
  name: github
  repo: Kivanc-Incedemir/ashihara-karate-turkiye
  branch: master
  base_url: "https://ashihara-cms-oauth.kivanc-incedemir.workers.dev"

publish_mode: simple
media_folder: "photos"
public_folder: "photos"

collections:
  - name: "gallery"
    label: "Galeri Fotoğrafları"
    description: "Sitedeki fotoğraf galerisine yeni fotoğraf ekleyin, sırasını değiştirin veya mevcut fotoğrafları düzenleyin."
    files:
      - name: "manifest"
        label: "Fotoğraf Listesi"
        file: "photos/manifest.json"
        fields:
          - label: "Fotoğraflar"
            name: "photos"
            widget: "list"
            summary: "{{fields.tr}}"
            fields:
              - { label: "Fotoğraf", name: "file", widget: "image", hint: "Galeriye eklemek için buradan bir fotoğraf yükleyin." }
              - label: "Kategori"
                name: "category"
                widget: "select"
                default: "training"
                options:
                  - { label: "Antrenman", value: "training" }
                  - { label: "Kuşak Sınavı", value: "grading" }
                  - { label: "Etkinlik", value: "event" }
              - { label: "Başlık (Türkçe)", name: "tr", widget: "string" }
              - { label: "Caption (English)", name: "en", widget: "string" }

  - name: "site_text"
    label: "Site Metinleri"
    description: "Sitedeki yazı metinlerini sayfaya göre gruplanmış olarak düzenleyin. Her satırda Türkçe ve İngilizce metni yan yana görürsünüz; anahtar (key) sütunu teknik bir referanstır ve düzenlenemez. Satır eklemeyin veya silmeyin, sadece mevcut metinleri değiştirin."
    files:
      - name: "global"
        label: "Genel (Menü, Üst Bilgi, Alt Bilgi)"
        description: "Menüde, sayfa üstündeki logoda ve tüm sayfaların alt bilgisinde (footer) görünen, her sayfada ortak olan metinler. Not: 'whatsapp.href' satırı bir bağlantıdır (https://wa.me/ ile başlamalı) — biçimini bozmadan dikkatli düzenleyin."
        file: "assets/i18n/sections/global.json"
        fields:
          - label: "Metinler"
            name: "strings"
            widget: "list"
            summary: "{{fields.key}}"
            allow_add: false
            min: 14
            max: 14
            fields:
              - { label: "Anahtar", name: "key", widget: "hidden" }
              - { label: "Türkçe", name: "tr", widget: "text" }
              - { label: "İngilizce", name: "en", widget: "text" }

      - name: "home"
        label: "Ana Sayfa"
        description: "Sadece Ana Sayfa'da (index.html) görünen başlık, buton ve bölüm metinleri."
        file: "assets/i18n/sections/home.json"
        fields:
          - label: "Metinler"
            name: "strings"
            widget: "list"
            summary: "{{fields.key}}"
            allow_add: false
            min: 19
            max: 19
            fields:
              - { label: "Anahtar", name: "key", widget: "hidden" }
              - { label: "Türkçe", name: "tr", widget: "text" }
              - { label: "İngilizce", name: "en", widget: "text" }

      - name: "about"
        label: "Ashihara Hakkında"
        description: "Ashihara Hakkında sayfasındaki tüm metinler."
        file: "assets/i18n/sections/about.json"
        fields:
          - label: "Metinler"
            name: "strings"
            widget: "list"
            summary: "{{fields.key}}"
            allow_add: false
            min: 33
            max: 33
            fields:
              - { label: "Anahtar", name: "key", widget: "hidden" }
              - { label: "Türkçe", name: "tr", widget: "text" }
              - { label: "İngilizce", name: "en", widget: "text" }

      - name: "gallery_page"
        label: "Galeri Sayfası Metinleri"
        description: "Galeri & Video sayfasındaki başlık ve filtre metinleri. (Fotoğrafların kendisini eklemek için yukarıdaki 'Galeri Fotoğrafları' bölümünü kullanın.) Not: 'gal.empty.body' satırında <code>...</code> etiketi var, bu etiketleri silmeyin."
        file: "assets/i18n/sections/gallery.json"
        fields:
          - label: "Metinler"
            name: "strings"
            widget: "list"
            summary: "{{fields.key}}"
            allow_add: false
            min: 13
            max: 13
            fields:
              - { label: "Anahtar", name: "key", widget: "hidden" }
              - { label: "Türkçe", name: "tr", widget: "text" }
              - { label: "İngilizce", name: "en", widget: "text" }

      - name: "dojos"
        label: "Dojolar & İletişim"
        description: "Dojolar & İletişim sayfasındaki adres, program ve iletişim formu metinleri."
        file: "assets/i18n/sections/dojos.json"
        fields:
          - label: "Metinler"
            name: "strings"
            widget: "list"
            summary: "{{fields.key}}"
            allow_add: false
            min: 22
            max: 22
            fields:
              - { label: "Anahtar", name: "key", widget: "hidden" }
              - { label: "Türkçe", name: "tr", widget: "text" }
              - { label: "İngilizce", name: "en", widget: "text" }

      - name: "world_history"
        label: "Dünya Tarihçesi"
        description: "Dünya Tarihçesi sayfasındaki tüm metinler."
        file: "assets/i18n/sections/world-history.json"
        fields:
          - label: "Metinler"
            name: "strings"
            widget: "list"
            summary: "{{fields.key}}"
            allow_add: false
            min: 33
            max: 33
            fields:
              - { label: "Anahtar", name: "key", widget: "hidden" }
              - { label: "Türkçe", name: "tr", widget: "text" }
              - { label: "İngilizce", name: "en", widget: "text" }

      - name: "turkey_history"
        label: "Türkiye Tarihçesi"
        description: "Türkiye Tarihçesi sayfasındaki tüm metinler."
        file: "assets/i18n/sections/turkey-history.json"
        fields:
          - label: "Metinler"
            name: "strings"
            widget: "list"
            summary: "{{fields.key}}"
            allow_add: false
            min: 32
            max: 32
            fields:
              - { label: "Anahtar", name: "key", widget: "hidden" }
              - { label: "Türkçe", name: "tr", widget: "text" }
              - { label: "İngilizce", name: "en", widget: "text" }
